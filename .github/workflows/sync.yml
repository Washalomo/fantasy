name: Sincronizar Liga de Primera

on:
  schedule:
    - cron: '7,37 * * * *'   # cada 30 minutos
  workflow_dispatch:
    inputs:
      season:
        description: 'Recalcular la temporada completa'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['src/**', 'shared/**', '.github/workflows/sync.yml']

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer ESPN, calcular y guardar
        env:
          SYNC_ARGS: ${{ (github.event_name == 'push' || inputs.season) && '--season' || '' }}
        run: |
          git config user.name "fantasy-sync"
          git config user.email "fantasy-sync@users.noreply.github.com"
          # si otra ejecución guardó datos antes, se toma lo más nuevo, se recalcula y se reintenta
          for i in 1 2 3; do
            node src/sync.js $SYNC_ARGS
            git add data
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -m "datos: sincronización $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then exit 0; fi
            git fetch origin main && git reset --hard origin/main
          done
          exit 1
