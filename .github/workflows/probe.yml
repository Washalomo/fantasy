name: Probar fuentes de estadísticas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/probe.js', '.github/workflows/probe.yml']

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar Sofascore y FotMob
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          git config user.name "fantasy-sync"
          git config user.email "fantasy-sync@users.noreply.github.com"
          node tools/probe.js
          for i in 1 2 3; do
            git add data/debug/probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "prueba de fuentes de estadísticas"
            if git push; then exit 0; fi
            git fetch origin main && git rebase origin/main
          done
